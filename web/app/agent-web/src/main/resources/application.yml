# ============================================================================
#  Web 通道专属配置（agent-web）
#
#  【本文件只放「通道专属」键】
#  跨通道共用的业务配置（model / executor / core / skill / mcp / memory）已收敛到
#  agent-common 的 lucky-defaults.yml，由下方 spring.config.import 导入。
#  导入配置的优先级**低于**本文件，因此在本文件里重复声明那些键会静默顶掉共享值
#  —— 那正是 D3「Web/CLI 配置漂移」的成因，切勿再犯。
# ============================================================================

server:
  port: 8080

spring:
  application:
    name: lucky-agent
  main:
    banner-mode: off
  # 跨通道共用业务配置的唯一事实源（位于 agent-common，随依赖 jar 一起上 classpath）
  config:
    import: classpath:lucky-defaults.yml

logging:
  level:
    root: INFO
    com.lucky.agent: INFO
    io.agentscope: WARN

# 工作空间目录规范（§3.0）：根路径为 Agent 必备目录，硬编码不可更改
# 单根=<user.home>/.lucky_agent，必备子目录无点前缀（config/memory/platform/skills/mcp 等）

# ---------------------------------------------------------------------------
# Web 通道专属的框架配置（同一顶层键下集中维护，勿在文件内重复声明 lucky:）
# ---------------------------------------------------------------------------
lucky:
  web:
    # 前端静态资源托管（生产形态：后端 8080 直接托管 web/fronted/dist）
    # 留空 = 自动探测（相对工作目录 + 相对 classes 位置的候选路径），覆盖从 web/app
    # 与从仓库根两种启动方式；若部署到自定义目录，填绝对路径显式覆盖，例如：
    #   frontend-dist: E:/JavaPro/lucky_agent/web/fronted/dist
    frontend-dist: ""
  # 工作流是 Web 侧能力：agent-cli 的构建期禁令明确禁止依赖 agent-workflow（决策 D11），
  # 故 lucky.workflow.* 不放进共用配置文件，留在 Web 专属配置里
  workflow:
    # 定义与实例的落盘根目录。留空 = 使用框架必备目录 <user.home>/.lucky_agent/workflow
    # （定义落根、运行实例落 instances/ 子目录，实例默认保留最近 200 条）。
    # 仅在需要把工作流数据放到别处时才显式指定，例如：
    #   storage-dir: D:/lucky-workflow
    storage-dir: ""
    execution:
      # 引擎实现：legacy=自研 Kahn 调度（默认）；langgraph=LangGraph4j 状态图。
      # 两者执行契约一致，切换对 REST/SSE/前端透明。
      engine: legacy
    sandbox:
      # 命令（CODE）节点沙箱：默认关闭，需显式授权后才允许执行命令。
      # 开启后命令不再由工作流模块自行 ProcessBuilder 执行，而是收口到本机执行臂，
      # 与 Agent 工具调用同一链路（权限裁决 deny>ask>allow + realpath 硬边界 + OS 红线 + 断路器）。
      # 注意：执行臂返回的 ASK/拒绝一律按拦截处理——工作流在后台运行，无人能应答确认。
      enabled: false
      # 命令归入的工作空间 ID。留空 = 回退内置默认工作空间（<user.home>/.lucky_agent/workspace）。
      # 执行臂按工作空间解析权限级别与 realpath 根，生产环境建议显式指定。
      workspace-id: ""