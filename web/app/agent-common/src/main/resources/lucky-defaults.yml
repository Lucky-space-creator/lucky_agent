# ============================================================================
#  Lucky Agent 跨通道共用业务配置（单一事实源）
#
#  为什么存在这个文件：
#  Web（agent-web）与 CLI（agent-cli）共用同一内核、同一执行臂、同一记忆与
#  Skill 体系（决策 D11/D20）。此前这些「两边必须一致」的业务键只写在
#  agent-web/application.yml 里，而 agent-cli 没有 application.yml，于是 CLI
#  只能吃代码里的 @ConfigurationProperties 兜底默认值 —— 结果是同一个内核在
#  两个通道上行为不同。已实际发生的分叉：
#    · executor.sandbox-enabled    Web=true / CLI=false  ⇒ CLI 下任何命令都无法执行
#    · core.orchestrator-max-iterations  Web=5 / CLI=3   ⇒ CLI 更早被安全阀强制结束
#
#  【维护铁律】本文件是上述业务键的**唯一归属地**。
#  两个通道的 application.yml 只允许写「通道专属」配置，**不得**再声明这里已有的键
#  （导入配置的优先级低于导入方，重复声明会让共享值被静默顶掉，等于把漂移又装回来）。
#
#  通道专属配置的归属：
#    · agent-web/application.yml → server.port / spring.* / logging.* / lucky.web.* / lucky.workflow.*
#    · agent-cli                → 见 CliApplication#setDefaultProperties（纯终端形态相关）
#
#  加载方式：两个通道各自的 application.yml 里写
#      spring.config.import: classpath:lucky-defaults.yml
# ============================================================================

# ---------------------------------------------------------------------------
# 模型模块
# ---------------------------------------------------------------------------
model:
  # 上下文占用阈值：超过即触发压缩
  context-threshold: 0.9
  # 端点健康探测周期（秒）
  health-probe-sec: 60

# ---------------------------------------------------------------------------
# 执行臂（决策 D2/D23：硬边界由执行臂强制，不随权限模式关闭）
# ---------------------------------------------------------------------------
executor:
  # ExecutionTransport 实现：local（进程内/IPC）；方案 B 远端时切 wss
  transport: local
  # realpath 硬边界严格开启
  boundary-strict: true
  # 命令执行沙箱总开关。CLI 与 Web 必须同为 true，否则其中一个通道无法执行任何命令
  sandbox-enabled: true
  # 单条命令执行超时（秒）
  cmd-timeout-sec: 30

# ---------------------------------------------------------------------------
# 编排（安全阀与步数上限，决策 D31/D33：三主循环共用同一组参数）
# ---------------------------------------------------------------------------
core:
  plan-max-steps: 12
  act-max-steps: 30
  run-max-turns: 30
  # token 预算上限，-1 = 不限制
  run-max-budget: -1
  subagent-enabled: false
  subagent-max-concurrency: 4
  subagent-task-timeout-sec: 300
  # 主回环最大迭代次数（安全阀 N：超过强制结束并总结）。
  # 语义：1 轮 = 一次完整的「分析(PLAN) → 执行/调度(ACT) → 客观验证 → 判定是否达成」。
  # 该值同时被 reactor / langgraph / thin 三个主循环读取，改动会同时影响三者。
  orchestrator-max-iterations: 5
  # 早停置信阈值：客观验证通过率低于该值转 ASK 让用户决策（0~1）
  early-stop-confidence-threshold: 0.3
  # 子任务局部重试上限（超限提前终止并告知用户）
  orchestrator-max-retries: 2
  # 核心编排器实现切换：reactor（默认） / langgraph / thin
  orchestrator-mode: reactor
  # 重试指数退避基础毫秒数（第 n 次重试 = base * 2^(n-1)，上限 8s）
  retry-backoff-ms: 500
  # 客观验证器总开关（文件存在性 / 校验命令退出码）
  verification-enabled: true
  # 单个客观验证器超时（秒）
  verification-timeout-sec: 120
  # 条件选择（options）挂起超时（秒）：超时无人选择时自动采用推荐项继续；
  # <=0 表示不设超时（永久挂起，等待用户手动选择）
  options-timeout-sec: 300

# ---------------------------------------------------------------------------
# Skill（渐进披露式技能加载）
# ---------------------------------------------------------------------------
skill:
  # 语义召回 Top-K（非全量注入，省 token）
  topK: 5
  # 用户自定义 Skill 目录（相对框架根，默认 skills）
  userDir: skills
  # 平台预置目录（相对框架根，默认 platform，只读）
  platformDir: platform
  # 热插拔：定时扫描新增/删除 Skill（true=开启）
  hot-reload: true
  # 热插拔扫描周期（毫秒）
  hot-reload-ms: 30000

# ---------------------------------------------------------------------------
# MCP Server（热加载定时扫描）
# ---------------------------------------------------------------------------
mcp:
  # 热加载扫描周期（毫秒）
  hot-reload-ms: 60000

# ---------------------------------------------------------------------------
# 分层 Markdown 记忆（Hint 型：索引 + 条目，对标 Claude Code Auto Memory）
# 总结模型 = 模型配置中 role=memory 的记忆管理 Agent 端点；未配置时回退主力模型
# ---------------------------------------------------------------------------
memory:
  md:
    # 分层 md 记忆总开关（false 时回退旧 JSONL 双轨记忆）
    enabled: true
    # 分层记忆根目录名（相对框架根 memory/ 下）
    root: md
    # 会话内触发总结的轮数阈值（节流参考）
    trigger-turns: 5
    # LLM 总结失败重试上限
    max-retry: 2
    # MEMORY.md 索引行数 / 字节上限（超限保留最早条目并打修剪标记，由 Dream 整理）
    index-max-lines: 200
    index-max-bytes: 25600
    # 记忆预取选择器：每轮引擎 run 从两级索引挑出最相关条目注入（会话内去重）
    prefetch-enabled: true
    prefetch-top-k: 5
    # 可选：选择器专用廉价端点 id（空则回退主端点）
    prefetch-model-id: "26a16409-3bb2-4736-bedb-51cbb3af083d"
    # Dream 合成：周期（小时）与触发最少新增会话数；启动延迟（毫秒）
    dream-interval-hours: 24
    dream-min-new-sessions: 5
    dream-initial-delay-ms: 600000